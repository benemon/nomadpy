[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomadpy"
version = "0.1.0"
description = "Python client for the HashiCorp Nomad HTTP API"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Clustering",
]

[project.urls]
Homepage = "https://github.com/benemon/nomadpy"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.14"]
exec = ["websockets>=17"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=1", "mkdocs-literate-nav>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

# Import order in the package is set by its import cycles and by the model generator, not by isort.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["I"]
