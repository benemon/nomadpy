[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomadpy"
version = "0.1.0"
description = "Python client for the HashiCorp Nomad HTTP API"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Clustering",
]

[project.urls]
Homepage = "https://github.com/benemon/nomadpy"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
