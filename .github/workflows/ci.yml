name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        lane: [community, enterprise]
    env:
      NOMAD_LICENSE: ${{ matrix.lane == 'enterprise' && secrets.NOMAD_LICENSE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nomad
        run: |
          set -euo pipefail
          edition=""
          [ "${{ matrix.lane }}" = enterprise ] && edition="+ent"
          v="$(cat .nomad-version)${edition}"
          z="nomad_${v}_linux_amd64.zip"
          curl -sfLO "https://releases.hashicorp.com/nomad/${v}/${z}"
          curl -sfLO "https://releases.hashicorp.com/nomad/${v}/nomad_${v}_SHA256SUMS"
          grep "${z}" "nomad_${v}_SHA256SUMS" | sha256sum -c -
          mkdir -p "$HOME/nomad"
          unzip -oq "${z}" nomad -d "$HOME/nomad"
          sudo apt-get install -y --no-install-recommends openssl
          if [ -n "$edition" ]; then
            echo "NOMADPY_TEST_ENT_BIN=$HOME/nomad/nomad" >> "$GITHUB_ENV"
          else
            echo "NOMADPY_TEST_CE_BIN=$HOME/nomad/nomad" >> "$GITHUB_ENV"
          fi
      - name: Write the Enterprise licence
        if: ${{ matrix.lane == 'enterprise' && env.NOMAD_LICENSE != '' }}
        run: |
          umask 077
          printf '%s\n' "$NOMAD_LICENSE" > "$HOME/nomad.hclic"
          echo "NOMAD_LICENSE_PATH=$HOME/nomad.hclic" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e '.[dev,exec]'
      - name: Test
        # Each xdist worker starts its own session agents, so the lanes split across workers without sharing state.
        run: pytest -q -rs -n 2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests oracle

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oracle/go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fixtures and models match the pinned module
        run: |
          make oracle
          make models
          git diff --exit-code -- oracle/fixtures src/nomadpy
