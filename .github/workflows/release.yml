name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag matches the project version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Tagged commit has a green test run
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed right after a merge arrives before the commit's ci run has finished; wait for it.
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.name == "ci")]')
            if [ "$(jq 'map(select(.conclusion == "success")) | length' <<< "$runs")" -ge 1 ]; then exit 0; fi
            if [ "$(jq 'length' <<< "$runs")" -ge 1 ] && [ "$(jq 'map(select(.status != "completed")) | length' <<< "$runs")" -eq 0 ]; then
              echo "the ci run for ${GITHUB_SHA} did not succeed"; exit 1
            fi
            echo "waiting for the ci run of ${GITHUB_SHA}"; sleep 30
          done
          echo "no successful ci run for ${GITHUB_SHA} after 30 minutes"; exit 1
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
