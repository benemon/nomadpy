name: test

on:
  push:
  pull_request:

env:
  NOMAD_VERSION: "2.0.5"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nomad Community and Enterprise
        run: |
          set -euo pipefail
          for edition in "" "+ent"; do
            v="${NOMAD_VERSION}${edition}"
            z="nomad_${v}_linux_amd64.zip"
            curl -sfLO "https://releases.hashicorp.com/nomad/${v}/${z}"
            curl -sfLO "https://releases.hashicorp.com/nomad/${v}/nomad_${v}_SHA256SUMS"
            grep "${z}" "nomad_${v}_SHA256SUMS" | sha256sum -c -
            mkdir -p "$HOME/nomad${edition}"
            unzip -oq "${z}" nomad -d "$HOME/nomad${edition}"
          done
          sudo apt-get install -y --no-install-recommends openssl
          echo "NOMADPY_TEST_CE_BIN=$HOME/nomad/nomad" >> "$GITHUB_ENV"
          echo "NOMADPY_TEST_ENT_BIN=$HOME/nomad+ent/nomad" >> "$GITHUB_ENV"
      - name: Write the Enterprise licence
        if: ${{ env.NOMAD_LICENSE != '' }}
        run: |
          umask 077
          printf '%s\n' "$NOMAD_LICENSE" > "$HOME/nomad.hclic"
          echo "NOMAD_LICENSE_PATH=$HOME/nomad.hclic" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q -rs

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fixtures and models match the pinned module
        run: |
          make oracle
          make models
          git diff --exit-code -- oracle/fixtures src/nomadpy
