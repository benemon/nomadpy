# No pip entry: the package has no runtime dependencies and the dev and docs
# groups hold floors, not pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /oracle
    schedule:
      interval: weekly
    # Nested module: Dependabot resolves the parent hashicorp/nomad tag, which
    # does not contain the api package, and fails the whole go_modules run.
    # The pin moves with `make bump`.
    ignore:
      - dependency-name: github.com/hashicorp/nomad/api
    groups:
      go:
        patterns: ["*"]
